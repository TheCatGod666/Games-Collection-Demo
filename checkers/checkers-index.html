<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Viewport optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

    <!-- Mobile web app capabilities -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Preload critical mobile resources -->
    <link rel="stylesheet" href="mobile-optimizations.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>Checkers</title>
    <link rel="stylesheet" href="checkers-styles.css">
</head>

<body>
    <header>
        <h1>Checkers Game</h1>
        <p>A classic game of strategy and skill!</p>
    </header>
    
    <main id="game-container">
        <div id="checkers-board">
            <!-- Checkers board will be generated by JavaScript -->
        </div>
        
        <div id="game-info">
            <div id="turn-indicator">Red's Turn</div>
            <div id="status-message">Make your move!</div>
            <div id="score-display">
                <div class="score-item">Red: <span id="red-score">0</span></div>
                <div class="score-item">Black: <span id="black-score">0</span></div>
                <div class="score-item">Draws: <span id="draw-score">0</span></div>
            </div>
        </div>
        
        <section id="controls">
            <button id="new-game">New Game</button>
            <button id="reset-score">Reset Score</button>
            <button id="undo-move">Undo Move</button>
            <button id="redo-move">Redo Move</button>
            <button id="save-game">Save Game</button>
            <button id="load-game">Load Game</button>
            <button id="toggle-ai">Toggle AI</button>
            <button id="hint-move">Hint</button>
            <button id="multi-capture">Multi-Capture: OFF</button>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2026 Checkers Inc. ♔ ♕ ♖ ♗ ♘ ♙</p>
    </footer>
    
    <script src="checkers-script.js"></script>
</body>
</html>
